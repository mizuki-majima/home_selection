- id: calc-payment-4000
  claim: 4,000万円・35年・元利均等の毎月返済額（年0.8%／2.0%／3.46%）
  values: { r08: 10.9, r20: 13.3, r346: 16.4 }
  unit: 万円/月
  asOf: 2026-09
  source:
    title: 【フラット35】借入金利の推移・金利情報
    publisher: 住宅金融支援機構
