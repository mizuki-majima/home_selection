# 03 土地選び
- id: law-toshikeikaku-zones
  claim: 用途地域は13種類（田園住居地域を含む）
  value: 13
  unit: 種類
  asOf: 現行法令
  source:
    title: 都市計画法
    publisher: e-Gov法令検索
    url: https://laws.e-gov.go.jp/law/343AC0000000100
    type: primary
  volatility: stable

- id: law-kijunho-bcr
  claim: 建ぺい率は都市計画で決まる。角地、または防火・準防火地域で一定の耐火性能がある建物は+10%、両方なら+20%（53条）
  asOf: 現行法令
  source: &kijunho
    title: 建築基準法
    publisher: e-Gov法令検索
    url: https://laws.e-gov.go.jp/law/325AC0000000201
    type: primary
  volatility: stable

- id: law-kijunho-far
  claim: 前面道路の幅が12m未満なら、幅×0.4（住居系）または×0.6（その他）と指定容積率の小さいほうが適用される（52条）
  values: { residential: 0.4, other: 0.6, threshold: 12 }
  asOf: 現行法令
  source: *kijunho
  volatility: stable

- id: law-kijunho-road
  claim: 道路は原則幅4m以上。敷地は道路に2m以上接すること（42条1項、43条1項。例外あり）
  values: { width: 4, frontage: 2 }
  asOf: 現行法令
  source: *kijunho
  volatility: stable

- id: law-kijunho-road2
  claim: 幅4m未満の2項道路は、中心線から2mの線を道路の境界とみなす（42条2項）
  asOf: 現行法令
  source: *kijunho
  volatility: stable

- id: law-sekourei-setback
  claim: セットバック部分は敷地面積に算入しない（施行令2条1項1号）
  asOf: 現行法令
  source: &sekourei
    title: 建築基準法施行令
    publisher: e-Gov法令検索
    url: https://laws.e-gov.go.jp/law/325CO0000000338
    type: primary
  volatility: stable

- id: law-kijunho-height
  claim: 低層住居専用地域と田園住居地域の絶対高さは10mまたは12m（55条）。工業専用地域には住宅を建てられない
  asOf: 現行法令
  source: *kijunho
  volatility: stable

- id: law-kijunho-north
  claim: 北側斜線は、低層住居専用・田園住居地域が5m＋1.25勾配、中高層住居専用地域が10m＋1.25勾配（56条）
  asOf: 現行法令
  source: *kijunho
  volatility: stable

- id: rftc-ad-rules
  claim: 広告表示のルール。接道2m未満は「再建築不可」か「建築不可」と明示。セットバック部分がおおむね10%以上なら面積も明示。路地状部分・傾斜地がおおむね30%以上ならその旨を表示
  asOf: 現行規約
  source: &rftc
    title: 不動産の表示に関する公正競争規約
    publisher: 不動産公正取引協議会連合会
    url: https://www.rftc.jp/webkanri/kanri/wp-content/uploads/2019/02/h_kiyaku.pdf
    type: primary
  volatility: stable

- id: rftc-conditional-land
  claim: 建築条件付土地の広告には、建築条件付きであること、請負契約の期限、条件が成立しなければ契約を解除し受け取った金銭をすべて返還する旨を表示する
  asOf: 現行規約
  source: *rftc
  volatility: stable

- id: law-sekourei-retaining-wall
  claim: 高さ2mを超える擁壁は、建築基準法が準用される工作物（施行令138条）
  asOf: 現行法令
  source: *sekourei
  volatility: stable

- id: law-takken-hazard
